# ============================================
# BMKG Data Platform — Docker Compose Skeleton
# ============================================
# Profiles strategy (CLAUDE.md §3.4: data-flow first):
#   default: no services (just network + volumes declared)
#   phase-1: postgres + ingestion runner + minio
#   phase-2: adds lake services
#   ...
# Usage:
#   docker compose --profile phase-1 up
# ============================================


name: bmkg-platform

networks:
  weather-net:
    name: ${STACK_SUFFIX:-bmkg}_net
    driver: bridge

volumes:
  pg_data:
    name: ${STACK_SUFFIX:-bmkg}_pg_data
  minio_data:
    name: ${STACK_SUFFIX:-bmkg}_minio_data

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # -------------------------------------------------------------
  # Phase 1: postgres (for manual inspection during dev)
  # Activated when ingestion is being developed.
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    profiles: ["phase-1", "phase-4", "phase-5"]
    container_name: ${STACK_SUFFIX:-bmkg}_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./warehouse/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks: [weather-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  # -------------------------------------------------------------
  # Phase 1: MinIO (S3-compatible object storage)
  # Mounted from Phase 1 onward per user request (no host staging).
  # -------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    profiles: ["phase-1", "phase-2"]
    container_name: ${STACK_SUFFIX:-bmkg}_minio
    command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: ${TZ}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks: [weather-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

 # -------------------------------------------------------------
  # Phase 1: MinIO bucket bootstrap (one-shot init)
  # Creates weather-raw, weather-staged, weather-marts on first run.
  # -------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    profiles: ["phase-1", "phase-2"]
    container_name: ${STACK_SUFFIX:-bmkg}_minio_init
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_RAW} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_STAGED} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_MARTS} &&
      echo 'MinIO buckets initialized.'
      "
    networks: [weather-net]
    logging: *default-logging

  # -------------------------------------------------------------
  # Phase 1: Ingestion runner
  # Runs the BMKG parser + uploader. Single-shot in Phase 1
  # (will be replaced by Airflow DAG in Phase 8).
  # -------------------------------------------------------------
  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    profiles: ["phase-1"]
    container_name: ${STACK_SUFFIX:-bmkg}_ingestion
    env_file: .env
    environment:
      MINIO_ENDPOINT: minio:9000
      POSTGRES_HOST: postgres
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./ingestion:/app/ingestion
      - ./logs:/app/logs
    networks: [weather-net]
    logging: *default-logging